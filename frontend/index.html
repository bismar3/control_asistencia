<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema Web de Registro y Control de Asistencia — desarrollado por CODERS." />
    <meta name="theme-color" content="#050914" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Control de Asistencia · CODERS</title>
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      (function () {
        var theme = 'dark'
        try {
          var pref = localStorage.getItem('coders.theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          theme = pref === 'system' ? (prefersDark ? 'dark' : 'light') : pref
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
