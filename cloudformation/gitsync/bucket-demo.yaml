AWSTemplateFormatVersion: "2010-09-09"
Description: Demo de Git sync - bucket S3 seguro (sin secretos, para repositorio publico)

Parameters:
  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Ambiente del bucket

  Mensaje:
    Type: String
    Default: version 1
    Description: Texto que se guarda como etiqueta; se cambia para probar Git sync

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "control-asist-gitsync-${Ambiente}-${AWS::AccountId}"
      # Seguridad: cifrado, versionado y sin acceso publico
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Ambiente
          Value: !Ref Ambiente
        - Key: Mensaje
          Value: !Ref Mensaje

Outputs:
  NombreBucket:
    Description: Nombre del bucket creado por Git sync
    Value: !Ref Bucket

  MensajeActual:
    Description: Version desplegada desde GitHub
    Value: !Ref Mensaje